services:
  - type: web
    name: toplu-sms-admin-panel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEXTBELT_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMS_DELAY
        value: "1"
      - key: TEXTBELT_TIMEOUT
        value: "20"
      - key: SEND_WORKER_POLL
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
